name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: latest
    attributes:
      label: Version check
      description: The feature may already exist. See the [latest release](https://github.com/MithunWijayasiri/Pickwright/releases/latest).
      options:
        - label: I'm using the latest version of Pickwright
          required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you want?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you need it?
      description: The problem it solves for you.
    validations:
      required: true
