<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pickwright E2E Test Page</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 40px;
        max-width: 600px;
        margin: 0 auto;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input[type='text'],
      input[type='email'] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
      iframe {
        width: 100%;
        height: 150px;
        border: 1px dashed #ccc;
        margin-top: 30px;
      }
      .shadow-container {
        border: 1px solid #ccc;
        padding: 15px;
        margin-top: 20px;
        background: #fdfdfd;
      }
      /* ng-select stand-in: a wrapper whose only own classes are framework
         noise, with the stable handle on a visually-hidden descendant input. */
      ng-select {
        display: block;
        height: 40px;
        border: 1px solid #ccc;
        margin-bottom: 10px;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1>Pickwright E2E Mock Test Page</h1>

    <!-- 1. data-testid -->
    <div class="form-group">
      <button id="testid-button" data-testid="submit-btn">Submit TestID</button>
    </div>

    <!-- 2. getByPlaceholder -->
    <div class="form-group">
      <label>Username (No ID label association)</label>
      <input type="text" id="username-input" placeholder="Enter username" />
    </div>

    <!-- 3. getByLabel -->
    <div class="form-group">
      <label id="email-label" for="email-field">Email Address</label>
      <input type="email" id="email-field" />
    </div>

    <!-- 4. getByRole (with Accessible Name) -->
    <div class="form-group">
      <a href="https://example.com" id="home-link">Go Home</a>
    </div>

    <!-- 5. data-cy attribute on generic element (fallbacks) -->
    <div class="form-group">
      <div id="datacy-div" data-cy="container-box" style="padding: 10px; border: 1px solid #eee">
        CY Container Box with extremely long text content that exceeds fifty characters limit
      </div>
    </div>

    <!-- 6. Aria-label and Title accessible names -->
    <div class="form-group">
      <button id="aria-btn" aria-label="Close Dialog">X</button>
      <button id="title-btn" title="Information Details">Info</button>
    </div>

    <!-- 7. Angular Dropdown Warning trigger -->
    <div class="form-group">
      <button id="dropdown-trigger" aria-haspopup="listbox" aria-expanded="false">
        Select Option
      </button>
    </div>

    <!-- 7b. Two ng-select wrappers sharing classes; the only stable, unique
         handle is a descendant combobox input id. Without descendant scoping
         both wrappers would generate the identical (non-unique) CSS locator. -->
    <div class="form-group">
      <ng-select class="simp-form-control simp-select ng-select ng-pristine ng-invalid">
        <input role="combobox" type="text" id="tenureType-ctrl" class="visually-hidden" />
      </ng-select>
      <ng-select class="simp-form-control simp-select ng-select ng-untouched ng-pristine ng-invalid">
        <input role="combobox" type="text" id="holding-ctrl" class="visually-hidden" />
      </ng-select>
    </div>

    <!-- 7c. getByAltText: img with alt text and no other identifying strategy. -->
    <div class="form-group">
      <img
        id="logo-img"
        alt="Company Logo"
        width="40"
        height="40"
        src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
      />
    </div>

    <!-- 7d. getByTitle: sized empty element carrying only a title attribute. -->
    <div class="form-group">
      <span
        id="info-icon"
        title="More information"
        style="display: inline-block; width: 24px; height: 24px; background: #eee"
      ></span>
    </div>

    <!-- 7e. Chained getByTestId: the child testid repeats across two cards, so it
         is only unique when scoped by the parent card's testid. -->
    <div class="form-group">
      <div data-testid="card-alpha">
        <button data-testid="card-action">Alpha Action</button>
      </div>
      <div data-testid="card-beta">
        <button data-testid="card-action">Beta Action</button>
      </div>
    </div>

    <!-- 7f. Retarget to interactive parent: hovering the non-interactive icon
         inside the button should generate the button's locator, not the icon's. -->
    <div class="form-group">
      <button id="save-btn">
        <span
          id="save-icon"
          class="icon"
          style="display: inline-block; width: 16px; height: 16px; background: #fff"
        ></span>
        Save
      </button>
    </div>

    <!-- 8. Shadow DOM section -->
    <h2>Shadow DOM Sandbox</h2>
    <div class="shadow-container">
      <div id="shadow-host"></div>
    </div>

    <!-- 9. iframe for frameLocator testing -->
    <h2>Frame Sandbox</h2>
    <iframe
      id="test-iframe"
      srcdoc="
    <!DOCTYPE html>
    <html>
      <head>
        <style>body { font-family: sans-serif; padding: 20px; background: #fafafa; }</style>
      </head>
      <body>
        <button id='iframe-btn'>Click Frame Button</button>
      </body>
    </html>
  "
    ></iframe>

    <script>
      // Initialize Shadow DOM with content
      const host = document.getElementById('shadow-host');
      const shadow = host.attachShadow({ mode: 'open' });
      shadow.innerHTML = `
      <div>
        <p>Inside Shadow Root:</p>
        <button id="shadow-btn" style="padding: 8px 16px; background-color: #28a745; color: white; border: none; cursor: pointer;">
          Shadow Button
        </button>
      </div>
    `;
    </script>
  </body>
</html>
